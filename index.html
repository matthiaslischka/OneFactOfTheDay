<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Fact of the Day</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #000;
      padding: 2rem;
      box-sizing: border-box;
    }
    .fact {
      font-weight: bold;
      font-size: 2.5rem;
      color: #fff;
      max-width: 60rem;
      width: 100%;
      text-align: center;
      line-height: 1.3;
      margin: 0;
    }
    .source {
      margin-top: 1.5rem;
    }
    .source a {
      color: #9ca3af;
      font-size: 0.9rem;
      text-decoration: none;
      border-bottom: 1px solid #9ca3af;
    }
    .source a:hover {
      color: #fff;
      border-color: #fff;
    }
    .date {
      margin-top: 0.5rem;
      color: #4b5563;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <p class="fact">On October 10, 1911, soldiers of the Qing dynasty's New Army mutinied in Wuchang, igniting the Wuchang Uprising that touched off the Chinese Revolution and the downfall of over two millennia of imperial rule.</p>
  <p class="source"><a href="https://en.wikipedia.org/wiki/Wuchang_Uprising" target="_blank" rel="noopener noreferrer">Source: Wikipedia</a></p>
  <p class="date">2026-10-10</p>
</body>
</html>
